<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant website landing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
    /* 1. LAYER DEFINITION */
    @layer reset, base, layout, components, sections, utilities;

    @layer reset {
      button, hr, input { overflow: visible; }
      progress, sub, sup { vertical-align: baseline; }
      [type=checkbox], [type=radio], legend { box-sizing: border-box; padding: 0; }
      html { 
        line-height: 1.15; 
        -webkit-text-size-adjust: 100%; 
        text-size-adjust: 100%;
        font-family: 'Inter', sans-serif;
      }
      body { margin: 0; background-color: #0d1b15; color: #DBFFEC; }
      details, main { display: block; }
      h1, h2, h3 { margin: 0; }
      ul { list-style: none; padding: 0; margin: 0; }
      a { text-decoration: none; color: inherit; }
      img { border-style: none; max-width: 100%; height: auto; }
      button { 
        background: none; 
        border: none; 
        cursor: pointer; 
        padding: 0; 
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    @layer layout {
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .mt-10 { margin-top: 40px; }
    }

    @layer components {
      .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 20px;
        padding-bottom: 20px;
      }
      .main-nav ul {
        display: flex;
        gap: 30px;
      }
      .main-header__actions {
        display: flex;
        gap: 15px;
      }
      
      .card {
        background: rgba(255, 255, 255, 0.05);
        padding: 24px;
        border: 1px solid rgba(219, 255, 236, 0.1);
      }
      .card--rounded-md { border-radius: 16px; }
      .card--flex-column { display: flex; flexDirection: column; }
      .card--gap-sm { gap: 12px; }
      
      .avatar {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar__image {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }
      .avatar__title { font-weight: 600; }
      .avatar__rating { display: flex; gap: 2px; }

      .card__action {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }
      .card__price { font-weight: 700; font-size: 1.2rem; }
    }

    @layer sections {
      .section-heading {
        font-size: 2.5rem;
        margin-bottom: 40px;
        text-align: center;
      }
      .top-selling__items, .reviews__items {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
      }
      .top-selling { padding: 80px 0; }
      .reviews { padding: 80px 0; }
    }
  </style>
</head>
<body>

  <header class="main-header container mt-10">
    <a href="/" class="logo main-header__logo">
      <img src="./assets/images/logos/main-logo.svg" alt="Main logo">
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Plant Type’s</a></li>
        <li><a href="#">More</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
    <div class="main-header__actions">

          <path d="M37.8598 41.3796C38.9198 44.5796 41.3398 44.8996 43.1998 42.0996C44.8998 39.5396 43.7798 37.4396 40.6998 37.4396C38.4198 37.4196 37.1398 39.1996 37.8598 41.3796Z" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button aria-label="Cart">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.8 13H31.2001C38.0001 13 38.6801 16.18 39.1401 20.06L40.9401 35.06C41.5201 39.98 40.0001 44 33.0001 44H15.0201C8.00005 44 6.48005 39.98 7.08005 35.06L8.88007 20.06C9.32007 16.18 10 13 16.8 13Z" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

          <path d="M40.82 34.06H16" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>   
      </button>
      <button aria-label="Profile">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24.2399 25.56C24.0999 25.54 23.9199 25.54 23.7599 25.56C20.2399 25.44 17.4399 22.56 17.4399 19.02C17.4399 15.4 20.3599 12.46 23.9999 12.46C27.6199 12.46 30.5599 15.4 30.5599 19.02C30.5399 22.56 27.7599 25.44 24.2399 25.56Z" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M37.48 38.76C33.92 42.02 29.2 44 24 44C18.8 44 14.08 42.02 10.52 38.76C10.72 36.88 11.92 35.04 14.06 33.6C19.54 29.96 28.5 29.96 33.94 33.6C36.08 35.04 37.28 36.88 37.48 38.76Z" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 44C35.0457 44 44 35.0457 44 24C44 12.9543 35.0457 4 24 4C12.9543 4 4 12.9543 4 24C4 35.0457 12.9543 44 24 44Z" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>  
      </button>          
    </div>
  </header>

  <main>
    <section class="top-selling container">
      <h2 class="section-heading">Our Top Selling</h2>
      <div class="top-selling__items">
        <div class="card card--rounded-md card--md card--flex-column card--gap-sm">

            <img src="assets/images/flowers/flower.png" alt="Flower">
          </div>
          <h3 class="card__title">Calathea plant</h3>
          <div class="card__info">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</div>
          <div class="card__action">
            <div class="card__price">$ 40</div>
            <button class="card__atc">

                <rect x="1" y="1" width="46" height="38" rx="7" stroke="#DBFFEC" stroke-width="2"/>

                <path d="M18.6667 14.6667V10.0001C18.6667 8.00008 20 6.66675 22 6.66675H26C28 6.66675 29.3333 8.00008 29.3333 10.0001V14.6667" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M35.2133 26.7065H18.6667" stroke="#DBFFEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>              
            </button>
          </div>
        </div>
        </div>
    </section>

    <section class="reviews container">
      <h2 class="section-heading">Customer Review</h2>
      <div class="reviews__items">
        <div class="card card--rounded-md card--lg card--flex-column card--gap-lg">
          <div class="avatar">
            <img src="https://media.istockphoto.com/id/1919265357/photo/close-up-portrait-of-confident-businessman-standing-in-office.jpg?s=612x612&w=0&k=20&c=ZXRPTG9VMfYM3XDo1UL9DEpfO8iuGVSsyh8dptfKQsQ=" class="avatar__image" alt="Avatar photo">

              <div class="avatar__title">Olexandr Ivanovich</div>
              <div class="avatar__rating">

                <svg width="16" height="16" viewBox="0 0 16 16" fill="#FFFBE6"><path d="M9.15333 2.33977L10.3267 4.68643C10.4867 5.0131 10.9133 5.32643 11.2733 5.38643L13.4 5.73977C14.76 5.96643 15.08 6.9531 14.1 7.92643L12.4467 9.57977C12.1667 9.85977 12.0133 10.3998 12.1 10.7864L12.5733 12.8331C12.9467 14.4531 12.0867 15.0798 10.6533 14.2331L8.66 13.0531C8.3 12.8398 7.70667 12.8398 7.34 13.0531L5.34667 14.2331C3.92 15.0798 3.05333 14.4464 3.42667 12.8331L3.9 10.7864C3.98667 10.3998 3.83333 9.85977 3.55333 9.57977L1.9 7.92643C0.926667 6.9531 1.24 5.96643 2.6 5.73977L4.72667 5.38643C5.08 5.32643 5.50667 5.0131 5.66667 4.68643L6.84 2.33977C7.48 1.06643 8.52 1.06643 9.15333 2.33977Z"/></svg>

          <p class="card__text">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt...

    </section>
  </main>
</body>
</html>
