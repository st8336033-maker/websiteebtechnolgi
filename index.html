<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planto - Breath Natureal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121a14;
            --accent-green: #29b874;
            --text-white: #dbffec;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(219, 255, 236, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Glassmorphism Effect */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; }
        nav ul { display: flex; gap: 30px; list-style: none; }
        nav a { text-decoration: none; color: var(--text-white); font-size: 14px; text-transform: uppercase; }

        /* Hero Section */
        .hero { padding: 150px 0 60px; display: flex; align-items: center; justify-content: space-between; }
        .hero-title { font-size: 64px; font-weight: 800; color: var(--accent-green); line-height: 1.1; margin-bottom: 20px; }
        
        .btn-outline {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--text-white);
            color: var(--text-white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Top Selling Grid */
        .section-title { text-align: center; font-size: 32px; margin: 60px 0; }
        .top-selling-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card-vertical {
            text-align: center;
            position: relative;
            margin-top: 60px;
            padding-top: 80px;
        }

        /* Фото, що "вилізає" з картки */
        .plant-img {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .cart-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 8px; }

        @media (max-width: 768px) {
            .top-selling-grid { grid-template-columns: 1fr; }
            .hero { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="container">
        <div class="logo">
            <img src="images/logos/main-logo.svg" alt="Logo" width="30">
            <span>Planto.</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Plant Type's</a></li>
                <li><a href="#">More</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
        <div style="display: flex; gap: 15px;">
            <img src="images/icons/search-normal.svg" width="24">
            <img src="images/icons/shopping-bag.svg" width="24">
            <img src="images/icons/profile-circle.svg" width="24">
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div style="max-width: 500px;">
                <h1 class="hero-title">Breath Natureal</h1>
                <p style="margin-bottom: 30px; opacity: 0.8;">Create your own jungle at home with our premium plants.</p>
                <button class="btn-outline">Explore</button>
            </div>
            
            <div class="glass-card" style="width: 300px; text-align: left;">
                <img src="images/flowers/flower.png" style="width: 100%; margin-top: -80px;">
                <h3 style="margin-top: 20px;">Calathea plant</h3>
                <button class="btn-outline" style="width: 100%; margin-top: 15px;">Buy Now</button>
            </div>
        </section>

        <h2 class="section-title">Our Top Selling</h2>
        
        <div class="top-selling-grid">
            <div class="glass-card card-vertical">
                <img src="images/flowers/flower.png" class="plant-img" alt="Plant">
                <h3>Calathea plant</h3>
                <p style="font-size: 12px; opacity: 0.6;">Perfect for home decor</p>
                <div class="price-row">
                    <span style="font-weight: 700; font-size: 20px;">$ 40</span>
                    <img src="images/icons/shopping-bag.svg" class="cart-icon">
                </div>
            </div>

            <div class="glass-card card-vertical">
                <img src="images/flowers/Plant@2x.png" class="plant-img" alt="Plant">
                <h3>Indoor Fern</h3>
                <p style="font-size: 12px; opacity: 0.6;">Easy to maintain</p>
                <div class="price-row">
                    <span style="font-weight: 700; font-size: 20px;">$ 45</span>
                    <img src="images/icons/shopping-bag.svg" class="cart-icon">
                </div>
            </div>

            <div class="glass-card card-vertical">
                <img src="images/flowers/flower.png" class="plant-img" alt="Plant">
                <h3>Cactus Mini</h3>
                <p style="font-size: 12px; opacity: 0.6;">Desert style</p>
                <div class="price-row">
                    <span style="font-weight: 700; font-size: 20px;">$ 25</span>
                    <img src="images/icons/shopping-bag.svg" class="cart-icon">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
